<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0E2E26">
    <meta name="description" content="Offline point of sale and stock management for small food and drink shops.">
    <title>F&amp;B Shop Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍽️</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--
      The whole interface is rendered by app.js into #app, so the markup for
      each screen lives in exactly one place. Everything below #app sits
      outside it on purpose: re-rendering a screen must not wipe the toast
      stack, an open dialog, or the pending receipt.
    -->
    <div id="app" class="app-root"></div>

    <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="print-area" class="print-area" aria-hidden="true"></div>

    <noscript>
        <div class="screen">
            <div class="card notice">
                <h1>JavaScript is switched off</h1>
                <p>This app runs entirely in your browser, so it needs JavaScript enabled to open the local database.</p>
            </div>
        </div>
    </noscript>

    <script src="db.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
